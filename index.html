<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASF Galeria — Mural de fotos do surf feminino</title>
<meta name="description" content="Mural de fotos da comunidade ASF: suas melhores sessões, ondas e momentos no mar. Satélite do app ASF.">
<link rel="canonical" href="https://acarolmourad-commits.github.io/asf-galeria/">
<style>body{font-family:system-ui,sans-serif;margin:0;background:#fdf2f8;color:#500724}header{background:#db2777;color:#fff;padding:2rem;text-align:center}nav{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;padding:1rem;background:#fce7f3}nav a{color:#be185d;text-decoration:none;font-size:.85rem}main{max-width:900px;margin:2rem auto;padding:0 1rem}.card{background:#fff;border-radius:16px;padding:1.5rem;margin-bottom:1rem;box-shadow:0 1px 4px rgba(0,0,0,.08)}input{width:100%;padding:.6rem;margin:.3rem 0;border:1px solid #f9a8d4;border-radius:8px;box-sizing:border-box}button{background:#db2777;color:#fff;border:0;border-radius:9999px;padding:.8rem 1.6rem;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem}.ph{border-radius:12px;overflow:hidden;background:#fce7f3}.ph img{width:100%;display:block}.ph p{padding:.5rem;font-size:.8rem;margin:0}footer{text-align:center;padding:2rem;color:#9d174d}</style>
</head>
<body>
<header><h1>ASF Galeria 📸</h1><p>Mural de fotos da comunidade — suas melhores ondas</p></header>
<nav id="net"></nav>
<main>
<div class="card">
<h2>➕ Adicionar foto</h2>
<input id="url" placeholder="URL da foto (ex: link do Instagram/Imgur)">
<input id="leg" placeholder="Legenda (ex: Drop perfeito em Maresias 🌊)">
<input id="aut" placeholder="Seu nome ou @instagram">
<button onclick="add()">Publicar no mural</button>
<p style="font-size:12px;color:#9d174d">O mural fica salvo no seu navegador. Compartilhe também na <a href="https://acarolmourad-commits.github.io/asf-comunidade/">Comunidade</a>!</p>
</div>
<div class="card"><h2>🖼️ Mural</h2><div class="grid" id="wall"></div></div>
<div class="card"><p>📍 Marque o pico no <a href="https://acarolmourad-commits.github.io/asf-praias/">Guia de Praias</a> e registre a sessão no <a href="https://acarolmourad-commits.github.io/asf-diario/">Diário</a>.</p></div>
</main>
<footer>ASF Galeria — satélite do <a href="https://acarolmourad-commits.github.io/asf-app/">app ASF</a></footer>
<script>
const sites=[["asf-app","App ASF"],["asf-praias","Praias"],["asf-previsao","Previsão"],["asf-treino","Treino"],["asf-eventos","Eventos"],["asf-glossario","Glossário"],["asf-comunidade","Comunidade"],["asf-seguranca","Segurança"],["asf-equipamento","Equipamento"],["asf-quiz","Quiz"],["asf-nutricao","Nutrição"],["asf-viagens","Viagens"],["asf-bemestar","Bem-Estar"],["asf-diario","Diário"],["asf-apnea","Apneia"],["asf-carona","Carona"],["asf-ranking","Ranking"],["asf-alerta","Alerta"],["asf-mentorias","Mentorias"]];
document.getElementById('net').innerHTML=sites.map(s=>`<a href="https://acarolmourad-commits.github.io/${s[0]}/">${s[1]}</a>`).join('');
const K='asf-galeria';
const seed=[{u:'https://images.unsplash.com/photo-1502680390469-be75c86b636f?w=600',l:'Surf no litoral norte 🌊',a:'@asf.surffeminino'}];
function load(){return JSON.parse(localStorage.getItem(K)||'null')||seed;}
function render(){document.getElementById('wall').innerHTML=load().map(p=>`<div class="ph"><img src="${p.u}" alt="${p.l}" onerror="this.parentNode.remove()"><p>${p.l}<br><b>${p.a}</b></p></div>`).join('');}
function add(){const u=document.getElementById('url').value.trim();if(!u)return alert('Cole a URL da foto!');const g=load();g.unshift({u,l:document.getElementById('leg').value||'Momento ASF',a:document.getElementById('aut').value||'Anônima'});localStorage.setItem(K,JSON.stringify(g.slice(0,60)));render();}
render();
</script>
</body>
</html>
